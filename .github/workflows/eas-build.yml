name: EAS Build

# Builds Aiserie Tracks with Expo EAS straight from GitHub.
#
# ONE-TIME SETUP (see README for details):
#   1. Create a free account at https://expo.dev
#   2. Add a repository secret named EXPO_TOKEN with your Expo access token
#      (expo.dev -> Account Settings -> Access Tokens)
#   3. That's it — the first run auto-creates the EAS project, commits the
#      projectId into app.json ("Link EAS project" step), and starts the build.
#
# Every push to main (or a manual run below) builds the app in the cloud.
#
# NOTE: if you already ran `eas init` locally and have a projectId, paste it
# into app.json (extra.eas.projectId) and the link step will skip itself.

on:
  # Manual builds only — Android APKs are submitted from here once the
  # EXPO_TOKEN secret exists (repo -> Settings -> Secrets and variables ->
  # Actions). Re-add `push: branches: [main]` for automatic builds after that.
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'Build profile (preview = installable APK, production = store build)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Link EAS project (one-time, self-provisioning)
        run: |
          if grep -q '"projectId"' app.json; then
            echo "EAS project already linked in app.json — skipping."
          else
            echo "No projectId in app.json — creating a new EAS project..."
            eas init --account viztechstudiosss --non-interactive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "ci: auto-link EAS project (extra.eas.projectId)"
            git push
            echo "projectId committed — future runs will skip this step."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build with EAS
        env:
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
        run: eas build --platform ${{ github.event.inputs.platform || 'android' }} --profile ${{ github.event.inputs.profile || 'preview' }} --non-interactive

      - name: Publish GitHub release with APK
        if: ${{ (github.event.inputs.platform || 'android') == 'android' && (github.event.inputs.profile || 'preview') == 'preview' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Aiserie Tracks v4.0.0 — "Privacy & peace of mind"

            Fixes the crash when adding a balance (animated money counters used
            two animation drivers on the same view — the exact cause of the
            "Aiserie hit a snag" screen).

            New: privacy shield — balances hide behind a branded curtain whenever
            you leave the app (Settings -> Privacy & storage to toggle). Works
            together with the optional 4-digit pin lock.

            Everything from v3.0.x stays: backup & restore, CSV/PDF reports,
            recurring transactions, budget alerts, savings goals, storage meter,
            receipt scanning, purchase detection, dark mode.

            Your data carries over automatically — nothing is reset.
        run: node scripts/attach-release.mjs
