name: Android APK (runner build)

# Builds the installable universal APK on the GitHub runner itself with
# `eas build --local`. This path does not consume EAS cloud build quota:
# the Gradle build runs on the runner machine, while credentials (the same
# keystore every release has been signed with) are downloaded from Expo so
# existing installs keep upgrading cleanly.
#
# The APK is uploaded as a workflow artifact; attach it to a GitHub Release
# with `gh release upload` or the Releases API afterwards.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build APK with EAS local runner
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output "AiserieTracks-v${VERSION}.apk"
          echo "APK_NAME=AiserieTracks-v${VERSION}.apk" >> "$GITHUB_ENV"
          ls -la "AiserieTracks-v${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 14
