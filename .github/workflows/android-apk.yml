name: Android APK (runner build)

# Builds the installable universal APK on the GitHub runner itself with
# `eas build --local`. This path does not consume EAS cloud build quota:
# the Gradle build runs on the runner machine, while credentials (the same
# keystore every release has been signed with) are downloaded from Expo so
# existing installs keep upgrading cleanly.
#
# The APK is uploaded as a workflow artifact AND attached straight to the
# matching GitHub Release (v<version from app.json>), which is what the
# app's built-in update nudge points users to.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Build APK with EAS local runner
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --local \
            --non-interactive \
            --output "AiserieTracks-v${VERSION}.apk"
          echo "APK_NAME=AiserieTracks-v${VERSION}.apk" >> "$GITHUB_ENV"
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          ls -la "AiserieTracks-v${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            Aiserie Tracks v4.1.0 — "Orbit & Frost"

            New identity: the Orbit A monogram now leads the app icon, splash
            screens and boot experience; cards are frosted glass over a softly
            lit aurora backdrop; the boot screen is a quiet orbit around the
            mark; companions redrawn as clean flat illustrations.

            Everything from v4.0 stays: privacy shield, pin lock, backup &
            restore, reports, recurring transactions, budget alerts, goals.

            Your data carries over automatically — nothing is reset.
        run: |
          gh release view "v${APP_VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "v${APP_VERSION}" --repo "$GITHUB_REPOSITORY" --title "Aiserie Tracks v${APP_VERSION}" --notes "$RELEASE_NOTES"
          gh release upload "v${APP_VERSION}" "$APK_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Release v${APP_VERSION} updated with $APK_NAME"
